<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camp Sign In / Sign Out — NYSC PRS</title>

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

  <link rel="stylesheet" href="styles.css" />

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    .prs-step { display: none; }
    .prs-step.active { display: block; }
    .prs-mini-dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.85rem;
      margin: 1.25rem 0;
    }
    .prs-stat {
      background: linear-gradient(135deg, var(--nysc-green-mist) 0%, #ffffff 100%);
      padding: 1.25rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-soft);
      text-align: center;
      box-shadow: var(--shadow-xs);
      position: relative;
      overflow: hidden;
    }
    .prs-stat::after {
      content: '';
      position: absolute;
      right: -22px; top: -22px;
      width: 70px; height: 70px;
      background: radial-gradient(closest-side, var(--nysc-green-soft), transparent);
      opacity: 0.8;
      pointer-events: none;
    }
    .prs-stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--nysc-green-darker);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .prs-stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    .prs-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0;
      border-bottom: 1px dashed var(--border-soft);
      gap: 0.5rem;
    }
    .prs-meta-row:last-child { border-bottom: none; }
    .prs-meta-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
    }
    .prs-meta-value {
      font-weight: 700;
      color: var(--ink);
      text-align: right;
    }
    .prs-action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }
    .prs-action-row .btn {
      padding: 1rem;
      font-size: 1rem;
      border-radius: var(--radius);
    }
    @media (max-width: 480px) {
      .prs-action-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <div class="navbar-brand">
        <div class="logo-container">
          <img src="nysclogo.png" alt="NYSC Logo" class="nysc-logo" />
          <div class="brand-text-container">
            <span class="brand-logo">NYSC</span>
            <span class="brand-text">PRS Camp Monitoring</span>
          </div>
        </div>
      </div>
      <button class="navbar-toggle" id="navbarToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main class="page page-visitor">

    <!-- STEP 0: Loading / invalid QR -->
    <section class="card prs-step active" id="stepLoading">
      <h1>Validating QR Code…</h1>
      <p class="subtitle">Please wait while we verify this camp's QR code.</p>
      <div id="loadingStatus" class="status"></div>
    </section>

    <!-- STEP 1: Phone prompt -->
    <section class="card prs-step" id="stepPhone">
      <h1 id="campHeaderName">Camp</h1>
      <p class="subtitle" id="campHeaderMeta"></p>

      <form id="phoneForm" autocomplete="off">
        <label class="field">
          <span>Enter your registered phone number</span>
          <input type="tel" id="phoneInput" inputmode="numeric"
                 placeholder="e.g. 08012345678" required />
        </label>
        <button type="submit" class="btn btn-primary btn-block">Continue</button>
      </form>
      <div id="phoneStatus" class="status" style="margin-top: 1rem;"></div>
    </section>

    <!-- STEP 2: Mini dashboard + actions -->
    <section class="card prs-step" id="stepDashboard">
      <h1 id="dashStaffName">Staff</h1>
      <p class="subtitle" id="dashCampLine"></p>

      <div class="prs-mini-dashboard">
        <div class="prs-stat"><div class="prs-stat-value" id="statRequired">-</div><div class="prs-stat-label">Required Days</div></div>
        <div class="prs-stat"><div class="prs-stat-value" id="statCompleted">-</div><div class="prs-stat-label">Completed Days</div></div>
        <div class="prs-stat"><div class="prs-stat-value" id="statRemaining">-</div><div class="prs-stat-label">Remaining</div></div>
      </div>

      <div style="border: 1px solid #eee; border-radius: 8px; padding: 1rem; margin-top: 1rem;">
        <h3 style="margin-top: 0;">Today</h3>
        <div class="prs-meta-row">
          <span class="prs-meta-label">Sign-In</span>
          <span class="prs-meta-value" id="todaySignInBadge"><span class="status-badge pending">Not yet</span></span>
        </div>
        <div class="prs-meta-row">
          <span class="prs-meta-label">Sign-Out</span>
          <span class="prs-meta-value" id="todaySignOutBadge"><span class="status-badge pending">—</span></span>
        </div>
        <div class="prs-meta-row" id="assignmentDayRow">
          <span class="prs-meta-label">Assignment day</span>
          <span class="prs-meta-value" id="assignmentDayValue">—</span>
        </div>
        <div class="prs-meta-row">
          <span class="prs-meta-label">Last action</span>
          <span class="prs-meta-value" id="lastActionValue">—</span>
        </div>
      </div>

      <!-- Camp flow: sign-in once per day for days 1..N-1 (sign-out not used).
           On the final day (day N), sign in then sign out to complete. -->
      <div class="prs-action-row" id="actionRow">
        <button type="button" class="btn btn-primary btn-block" id="signInBtn" style="display:none;grid-column:1 / -1;">🟢 Sign In</button>
        <button type="button" class="btn btn-danger btn-block"  id="signOutBtn" style="display:none;grid-column:1 / -1;">🔴 Sign Out</button>
      </div>
      <p class="info info-muted" id="actionNotice" style="margin-top: 0.75rem; font-size: 0.85rem;">
        Your GPS must be within the camp radius. Location is captured on tap.
      </p>
      <div id="dashStatus" class="status" style="margin-top: 1rem;"></div>
    </section>

  </main>

  <script src="js/api.js"></script>
  <script src="js/prs.js"></script>
  <script>
    (function () {
      'use strict';

      // ---- Utility ----
      function qs(name) {
        const p = new URLSearchParams(location.search);
        return p.get(name) || '';
      }
      function showStep(id) {
        document.querySelectorAll('.prs-step').forEach(s => s.classList.remove('active'));
        const el = document.getElementById(id);
        if (el) el.classList.add('active');
      }
      function setStatus(id, msg, type) {
        const el = document.getElementById(id);
        if (!el) return;
        el.className = 'status' + (type ? ' status-' + type : '');
        el.textContent = msg || '';
      }
      function getGps(options) {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) return reject(new Error('Geolocation not supported by this browser.'));
          navigator.geolocation.getCurrentPosition(
            pos => resolve(pos),
            ereg => reject(new Error('Could not get your location: ' + (ereg.message || ereg.code))),
            Object.assign({ enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }, options || {})
          );
        });
      }

      // ---- State from QR URL ----
      const eventId = qs('eventId');
      const campId  = qs('campId');
      const token   = qs('token');

      if (!eventId || !campId || !token) {
        showStep('stepLoading');
        setStatus('loadingStatus', 'This QR code is incomplete or malformed. Please scan the camp QR again.', 'error');
        return;
      }

      // Kept between steps
      let campInfo = null;    // { campId, campName, state, latitude, longitude, radiusMeters }
      let eventInfo = null;   // { eventId, eventName, status, startDate, endDate }
      let assignment = null;  // { assignmentId, staffName, department, requiredDays, ... }
      let currentPhone = '';  // normalized input phone

      // ---- Step 1: validate QR ----
      async function validate() {
        try {
          setStatus('loadingStatus', 'Validating QR code…');
          const res = await Prs.Staff.validateQr({ eventId, campId, token });
          campInfo = (res && res.data && res.data.camp) || null;
          eventInfo = (res && res.data && res.data.event) || null;
          if (!campInfo || !eventInfo) throw new Error('Invalid response from server.');

          document.getElementById('campHeaderName').textContent = campInfo.campName || 'Camp';
          document.getElementById('campHeaderMeta').textContent =
            (campInfo.state ? campInfo.state + ' • ' : '') +
            (eventInfo.eventName || '') +
            ' • Radius: ' + (campInfo.radiusMeters || 500) + 'm';

          showStep('stepPhone');
        } catch (e) {
          setStatus('loadingStatus',
            (e && e.message) || 'Could not validate QR code.',
            'error');
        }
      }

      // ---- Step 2: phone resolution + mini dashboard ----
      async function resolvePhoneAndShowDashboard(phone) {
        try {
          setStatus('phoneStatus', 'Looking up your assignment…');
          const res = await Prs.Staff.getStaffDashboard({ eventId, campId, token, phone });
          const d = (res && res.data) || {};
          assignment = d.assignment;
          const completed = Number(d.daysCompleted || 0);
          const required = Number(assignment.requiredDays || 0);
          const remaining = d.remainingDays != null
            ? Number(d.remainingDays)
            : Math.max(0, required - completed);
          const distinctIn = Number(d.distinctSignInDays || 0);
          const finished = d.assignmentFinished === true;
          const finalDay = d.isFinalAttendanceDay === true;

          document.getElementById('dashStaffName').textContent = assignment.staffName || 'Staff';
          document.getElementById('dashCampLine').textContent =
            (campInfo.campName || 'Camp') + ' (' + (campInfo.state || '') + ')' +
            (assignment.department ? ' • ' + assignment.department : '');
          document.getElementById('statRequired').textContent = required;
          document.getElementById('statCompleted').textContent = completed;
          document.getElementById('statRemaining').textContent = remaining;

          document.getElementById('todaySignInBadge').innerHTML =
            d.todaySignedIn
              ? '<span class="status-badge ok">Signed in</span>'
              : '<span class="status-badge pending">Not yet</span>';

          let outBadgeHtml;
          if (!d.todaySignedIn) {
            outBadgeHtml = '<span class="status-badge pending">—</span>';
          } else if (finalDay) {
            outBadgeHtml = d.todaySignedOut
              ? '<span class="status-badge ok">Signed out</span>'
              : '<span class="status-badge pending">Required to finish</span>';
          } else {
            outBadgeHtml = '<span class="status-badge ok" title="Sign-out is only on your last assignment day">Not required today</span>';
          }
          document.getElementById('todaySignOutBadge').innerHTML = outBadgeHtml;

          var dayLabel = '—';
          if (required >= 1) {
            if (d.todaySignedIn && finalDay) {
              dayLabel = 'Day ' + required + ' of ' + required + ' (final — sign out to complete)';
            } else if (d.todaySignedIn) {
              dayLabel = 'Day ' + distinctIn + ' of ' + required + ' (sign-in only; not the final day)';
            } else if (distinctIn < required) {
              dayLabel = 'Next sign-in will be day ' + (distinctIn + 1) + ' of ' + required;
            } else {
              dayLabel = required + ' day assignment';
            }
          }
          document.getElementById('assignmentDayValue').textContent = dayLabel;

          const la = d.lastAction;
          document.getElementById('lastActionValue').textContent = la
            ? (la.action.replace('_', ' ') + ' · ' + Prs.formatDateTime(la.timestamp))
            : '—';

          const signInBtnEl  = document.getElementById('signInBtn');
          const signOutBtnEl = document.getElementById('signOutBtn');
          const noticeEl     = document.getElementById('actionNotice');

          signInBtnEl.style.display  = 'none';
          signOutBtnEl.style.display = 'none';
          signInBtnEl.disabled  = false;
          signOutBtnEl.disabled = false;
          let notice = '';

          if (finished) {
            notice = 'You have completed this camp assignment. Thank you.';
          } else if (!d.todaySignedIn && distinctIn < required) {
            signInBtnEl.style.display = 'block';
            if (required === 1) {
              notice = 'Sign in, then sign out when you leave to complete your 1-day assignment.';
            } else {
              notice = 'Sign in once today. For days 1–' + (required - 1) + ', only sign-in is needed. On day ' + required + ' (final day), sign in then sign out to complete.';
            }
          } else if (d.todaySignedIn && finalDay && !d.todaySignedOut) {
            signOutBtnEl.style.display = 'block';
            notice = 'Final day: tap Sign Out when you leave camp to complete your assignment.';
          } else if (d.todaySignedIn && !finalDay) {
            notice = 'You are signed in for today. Sign-out is only required on your final assignment day (day ' + required + ').';
          } else if (!d.todaySignedIn && distinctIn >= required) {
            notice = 'All required sign-in days are recorded. If your final day is incomplete, complete sign-out on that day via your admin if needed.';
          } else {
            notice = "Today's attendance is complete. See you on the next assignment day.";
          }
          noticeEl.textContent = notice;

          setStatus('phoneStatus', '');
          showStep('stepDashboard');
        } catch (e) {
          setStatus('phoneStatus', (e && e.message) || 'Could not match your assignment.', 'error');
        }
      }

      // ---- Actions (sign in / out) ----
      async function performAttendance(kind) {
        const btnId = kind === 'SIGN_IN' ? 'signInBtn' : 'signOutBtn';
        const btn = document.getElementById(btnId);
        const originalText = btn.textContent;

        try {
          btn.disabled = true;
          btn.textContent = 'Getting location…';
          setStatus('dashStatus', 'Fetching GPS…');
          const pos = await getGps();
          btn.textContent = 'Submitting…';
          setStatus('dashStatus', 'Submitting…');

          const payload = {
            eventId, campId, token,
            phone: currentPhone,
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude,
            accuracy: pos.coords.accuracy || null,
          };

          const action = kind === 'SIGN_IN' ? Prs.Staff.signIn : Prs.Staff.signOut;
          const res = await action(payload);

          Swal.fire({
            icon: 'success',
            title: kind === 'SIGN_IN' ? 'Signed in!' : 'Signed out!',
            text: (res && res.message) || 'Attendance recorded.',
            timer: 2500, showConfirmButton: false,
          });
          setStatus('dashStatus', '');
          // Refresh dashboard to reflect new state
          await resolvePhoneAndShowDashboard(currentPhone);
        } catch (e) {
          setStatus('dashStatus', (e && e.message) || 'Failed to record attendance.', 'error');
          btn.textContent = originalText;
          btn.disabled = false;
        }
      }

      // ---- Wire up form / buttons ----
      document.getElementById('phoneForm').addEventListener('submit', function (ev) {
        ev.preventDefault();
        const phone = document.getElementById('phoneInput').value.trim();
        if (!phone) return;
        currentPhone = phone;
        resolvePhoneAndShowDashboard(phone);
      });

      document.getElementById('signInBtn').addEventListener('click',  () => performAttendance('SIGN_IN'));
      document.getElementById('signOutBtn').addEventListener('click', () => performAttendance('SIGN_OUT'));

      document.getElementById('navbarToggle')?.addEventListener('click', function () {
        const navbar = document.querySelector('.navbar-links');
        if (navbar) navbar.classList.toggle('active');
      });

      validate();
    })();
  </script>
</body>
</html>
